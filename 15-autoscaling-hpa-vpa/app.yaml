# =============================================================================
# DEMO · App de juguete para ver el HPA escalar (nginx)
# -----------------------------------------------------------------------------
# Crea dos recursos:
#   · Deployment my-app-deployment → 2 réplicas de nginx:1.14.2
#   · Service    my-app-service    → ClusterIP en el puerto 80 (para la carga)
#
# Los `resources` son ABSURDAMENTE pequeños a propósito:
#   requests.cpu = 1m  (una milésima de núcleo)
# El HPA calcula el porcentaje sobre el REQUEST, así que con 1m cualquier
# petición supera el 20 % objetivo y el escalado se ve en segundos.
# En una app real usarías, por ejemplo, requests.cpu: 100m y objetivo 80 %.
#
#   kubectl apply -f app.yaml
#   kubectl get pods -l app=nginx
#   kubectl get svc my-app-service
#
# Funciona igual en minikube (Ubuntu) y en Docker Desktop (Windows 11):
# no usa nada específico de minikube.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
spec:
  replicas: 2                # el HPA puede bajarlo a 1 (minReplicas) o subirlo a 4
  strategy:
    type: RollingUpdate      # al cambiar la imagen, reemplaza Pods de a uno
    rollingUpdate:
      maxSurge: 1            # puede crear 1 Pod extra durante la actualización
      maxUnavailable: 0      # y no deja el servicio sin réplicas disponibles
  selector:
    matchLabels:
      app: nginx             # debe coincidir con template.metadata.labels
  template:
    metadata:
      labels:
        app: nginx           # es la etiqueta que usan el selector y el Service
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80  # puerto que escucha nginx dentro del contenedor
        resources:
          requests:          # ⚠️ OBLIGATORIO para el HPA: es la base del %
            memory: "4Mi"
            cpu: "1m"        # 20 % de 1m = 0,2m → escala con casi nada de tráfico
          limits:            # el contenedor no puede pasar de aquí
            memory: "8Mi"    # si lo supera → OOMKilled
            cpu: "1m"        # al ser igual al request, se estrangula rápido
---
apiVersion: v1
kind: Service
metadata:
  name: my-app-service       # nombre que usa el load-generator del README
spec:
  selector:
    app: nginx               # manda tráfico a los Pods del Deployment de arriba
  ports:
    - protocol: TCP
      port: 80               # puerto DEL SERVICE
      targetPort: 80         # puerto DEL CONTENEDOR
  type: ClusterIP            # solo accesible dentro del clúster (basta para la carga)
