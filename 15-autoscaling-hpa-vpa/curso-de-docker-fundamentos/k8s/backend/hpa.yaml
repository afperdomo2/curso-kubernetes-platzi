# =============================================================================
# BACKEND · HPA (escalado horizontal de la API)
# -----------------------------------------------------------------------------
# Mantiene 1..5 réplicas intentando que el consumo medio de CPU quede en el
# 80 % del request (50m) → ~40m por Pod.
#
# Requisito: metrics-server operativo (ver README del módulo 15):
#   · minikube (Ubuntu):   minikube addons enable metrics-server
#   · Docker Desktop Win:  kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
#   kubectl apply -f k8s/backend/
#   kubectl get hpa backend-hpa
#   kubectl describe hpa backend-hpa
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment       # el Deployment definido al lado
  minReplicas: 1                   # nunca menos de 1 (la API debe responder)
  maxReplicas: 5                   # techo razonable para un clúster local
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization         # % medio sobre requests.cpu, no sobre el nodo
        averageUtilization: 80    # 80 % de 50m ≈ 40m por Pod
