# =============================================================================
# BACKEND · Deployment (API Flask del módulo 13)
# -----------------------------------------------------------------------------
# 1 réplica inicial. El HPA (backend-hpa) puede subirlo hasta 5 según CPU.
#
# ⚠️ La imagen se construye en local y NO está en ningún registry:
#   minikube (Ubuntu):      minikube image build -t backend:latest  ./backend
#   Docker Desktop (Win11): docker build -t backend:latest ./backend
# Por eso imagePullPolicy: Never → nunca intenta descargarla de Docker Hub.
#
#   kubectl apply -f k8s/backend/
#   kubectl get deploy,pods -l app=backend
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: autoscaling
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: curso-kubernetes
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1                     # punto de partida; el HPA manda a partir de aquí
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: backend                # ⚠️ inmutable: cambiarlo obliga a recrear
  template:
    metadata:
      labels:
        app: backend              # la usan el Service, el HPA y el PDB
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: backend
        image: backend:latest     # imagen construida en local (ver cabecera)
        imagePullPolicy: Never    # usa la imagen que ya está en el nodo
        ports:
        - name: http              # puerto con nombre
          containerPort: 5001
        readinessProbe:           # sin esto el HPA no escala con datos fiables
          httpGet:
            path: /getMyInfo      # el único endpoint de la API
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /getMyInfo
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:               # ⚠️ base del cálculo del HPA (80 % de 50m = 40m)
            cpu: "50m"
            memory: "128Mi"
          limits:                 # techo del contenedor: al llegar, se estrangula
            cpu: "100m"
            memory: "150Mi"
