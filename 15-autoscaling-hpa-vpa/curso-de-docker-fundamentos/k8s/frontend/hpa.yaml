# =============================================================================
# FRONTEND · HPA (escalado horizontal de nginx)
# -----------------------------------------------------------------------------
# Mantiene 1..3 réplicas intentando que el consumo medio de CPU quede en el
# 20 % del request (50m) → 10m por Pod.
#
# Ojo: 20 % de 50m es un umbral MUY sensible (10 milicore). Sirve para ver el
# escalado en la demo; en una app real nginx no llega ahí ni con carga.
#
# Requisito: metrics-server operativo (ver README del módulo 15):
#   · minikube (Ubuntu):   minikube addons enable metrics-server
#   · Docker Desktop Win:  kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
#   kubectl get hpa frontend-hpa
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: autoscaling
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: curso-kubernetes
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-deployment     # el Deployment definido al lado
  minReplicas: 1                  # nunca menos de 1
  maxReplicas: 3                  # techo para el clúster local
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization        # % medio sobre requests.cpu
        averageUtilization: 20   # 20 % de 50m = 10m por Pod
