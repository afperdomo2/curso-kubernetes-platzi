# =============================================================================
# HPA · Escalado horizontal del Deployment my-app-deployment
# -----------------------------------------------------------------------------
# Mantiene entre 1 y 4 réplicas intentando que el consumo medio de CPU de los
# Pods se quede en el 20 % de lo que piden (requests.cpu: 1m en app.yaml).
#
# Requisitos:
#   1. metrics-server funcionando (si no, TARGETS sale <unknown>)
#        · minikube (Ubuntu):   minikube addons enable metrics-server
#        · Docker Desktop Win:  kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   2. El contenedor debe declarar resources.requests.cpu (sin eso no hay %)
#
#   kubectl apply -f hpa.yaml
#   kubectl get hpa
#   kubectl describe hpa my-hpa      # los eventos explican cada decisión
# =============================================================================
apiVersion: autoscaling/v2           # v2 = métricas flexibles (v1 está obsoleto)
kind: HorizontalPodAutoscaler
metadata:
  name: my-hpa                       # nombre del recurso (no del Deployment)
spec:
  scaleTargetRef:                    # quién escala: el Deployment de app.yaml
    apiVersion: apps/v1
    kind: Deployment
    name: my-app-deployment
  minReplicas: 1                     # nunca baja de aquí, aunque no haya tráfico
  maxReplicas: 4                     # techo aunque la métrica se dispare
  metrics:
  - type: Resource                   # métrica de recursos del Pod (CPU/RAM)
    resource:
      name: cpu
      target:
        type: Utilization            # porcentaje medio sobre requests.cpu
        averageUtilization: 20       # 20 % de 1m = 0,2m → escala con muy poca carga
# Nota: el Service my-app-service se define en app.yaml; no lo dupliques aquí.
