# =============================================================================
# VPA · Escalado vertical del Deployment my-app-deployment (OPCIONAL)
# -----------------------------------------------------------------------------
# El VPA NO es un recurso nativo de Kubernetes: antes hay que instalar sus CRDs
# y sus componentes (recommender, updater, admission-controller):
#
#   git clone https://github.com/kubernetes/autoscaler.git
#   cd autoscaler/vertical-pod-autoscaler
#   ./hack/vpa-up.sh
#
#   # si falla creando los certificados del admission controller:
#   bash ./pkg/admission-controller/gencerts.sh
#
# El procedimiento es el mismo en minikube (Ubuntu) y en Docker Desktop
# (Windows 11): no hay addon de VPA en ninguno de los dos.
#
#   kubectl apply -f vpa.yaml
#   kubectl get vpa
#   kubectl describe vpa my-vpa      # muestra la recomendación y si aplica cambios
#
# ⚠️ No lo apliques a la vez que my-hpa sobre el MISMO Deployment con las
#    mismas métricas: el HPA sube réplicas y el VPA sube requests, y se pelean.
#    Para estudiar el VPA aquí, deja updateMode: "Off" (solo recomienda).
# =============================================================================
apiVersion: "autoscaling.k8s.io/v1"  # API del VPA (necesita las CRDs instaladas)
kind: VerticalPodAutoscaler
metadata:
  name: my-vpa                       # nombre del recurso VPA
spec:
  targetRef:                         # a quién ajusta los recursos
    apiVersion: "apps/v1"
    kind: Deployment
    name: my-app-deployment
  updatePolicy:
    updateMode: "Auto"               # Auto/Recreate reinician el Pod para aplicar;
                                     # "Off" solo recomienda, "Initial" aplica al crear
  resourcePolicy:
    containerPolicies:
    - containerName: '*'             # aplica a todos los contenedores del Pod
      minAllowed:                    # suelo que el VPA no bajará
        cpu: 1m
        memory: 4Mi
      maxAllowed:                    # techo que el VPA no superará
        cpu: 8m                      # ⚠️ valores de juguete: en real, 500m–2 CPU
        memory: 32Mi
      controlledResources: ["cpu", "memory"]   # métricas que puede ajustar
