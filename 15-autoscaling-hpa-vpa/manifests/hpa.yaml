# =============================================================================
# HPA · Escalado horizontal de `web`
# -----------------------------------------------------------------------------
# Mantiene entre 1 y 4 réplicas intentando que el consumo medio de CPU de los
# Pods se quede en el 20 % de lo que piden (requests.cpu: 1m).
#
# Se llama `web-hpa` (app + tipo de política) porque NO es la app: es la regla
# de escalado que apunta a ella. El Deployment y el Service sí se llaman `web`.
#
# Requisitos:
#   1. metrics-server funcionando (si no, TARGETS sale <unknown>)
#        · minikube (Ubuntu):   minikube addons enable metrics-server
#        · Docker Desktop Win:  kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#   2. El contenedor declara resources.requests.cpu (sin eso no hay %)
#
#   kubectl apply -f manifests/
#   kubectl get hpa -n autoscaling
#   kubectl describe hpa web-hpa -n autoscaling   # los eventos explican cada decisión
# =============================================================================
apiVersion: autoscaling/v2             # v2 = métricas flexibles (v1 está obsoleto)
kind: HorizontalPodAutoscaler
metadata:
  name: web-hpa
  namespace: autoscaling
  labels:                              # sin labels, `get hpa -l ...` no lo encuentra
    app.kubernetes.io/name: web
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/part-of: curso-kubernetes
spec:
  scaleTargetRef:                      # quién escala: el Deployment de manifests/
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 1                       # nunca baja de aquí, aunque no haya tráfico
  maxReplicas: 4                       # techo aunque la métrica se dispare
  behavior:                            # el freno anti-oscilación, explícito
    scaleUp:
      stabilizationWindowSeconds: 0    # subir rápido: la carga no espera
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30              # como mucho duplica cada 30 s
    scaleDown:
      stabilizationWindowSeconds: 300  # bajar despacio: ventana de 5 min
  metrics:
  - type: Resource                     # métrica de recursos del Pod (CPU/RAM)
    resource:
      name: cpu
      target:
        type: Utilization              # % medio sobre requests.cpu
        averageUtilization: 20         # 20 % de 1m = 0,2m → escala con poca carga
