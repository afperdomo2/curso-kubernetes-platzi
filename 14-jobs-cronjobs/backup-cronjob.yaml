# =============================================================================
# CRONJOB · Copia de seguridad programada de MySQL
# -----------------------------------------------------------------------------
# Un CronJob crea un Job según un horario (formato cron de 5 campos):
#   minuto  hora  día-mes  mes  día-semana
#   0-59    0-23  1-31     1-12 0-7 (0 y 7 = domingo)
#
# Aquí: "*/1 * * * *" = cada minuto (solo para practicar).
# En producción sería algo como "0 3 * * *" (diario a las 03:00).
#
# ⚠️ Este archivo solo define el CronJob: NO crea el PVC ni el PV.
#    El almacenamiento lo crea backup-job.yaml (PVC mysql-backup-pvc y
#    PV mysql-backup-pv). Si no existe, los Jobs del CronJob quedan Pending.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: curso-kubernetes
spec:
  schedule: "*/1 * * * *"         # cada minuto (¡solo demo!)
  concurrencyPolicy: Forbid       # si el Job anterior sigue vivo, no lanza otro
  startingDeadlineSeconds: 120    # margen si se pierde el horario
  successfulJobsHistoryLimit: 3   # conserva los 3 últimos Jobs exitosos
  failedJobsHistoryLimit: 1       # conserva el último Job fallido
  jobTemplate:                    # plantilla del Job que crea en cada ejecución
    metadata:
      labels:                     # labels de los Jobs generados
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: backup
        app.kubernetes.io/part-of: curso-kubernetes
    spec:
      backoffLimit: 4             # mismo valor que el Job manual
      activeDeadlineSeconds: 3600 # timeout total (1 hora)
      template:
        metadata:
          labels:                 # labels de los Pods generados
            app.kubernetes.io/name: mysql
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: curso-kubernetes
        spec:
          containers:
          - name: mysql-backup
            image: mysql:8.0
            command:
            - /bin/bash
            - -c
            - |
              mysqldump -h mysql-headless -u root "$MYSQL_DATABASE" > /backup/mysql-backup-$(date +%Y%m%d_%H%M).sql
            env:                  # mismas credenciales que el Job
            - name: MYSQL_PWD     # mysqldump lee la contraseña de esta variable
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: database-name
            volumeMounts:
            - name: backup-storage
              mountPath: /backup
            resources:
              requests:
                cpu: "100m"
                memory: "128Mi"
              limits:
                cpu: "500m"
                memory: "256Mi"
          volumes:
          - name: backup-storage
            persistentVolumeClaim:
              claimName: mysql-backup-pvc
          restartPolicy: Never    # obligatorio en el Pod del Job
