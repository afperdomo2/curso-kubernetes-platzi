# =============================================================================
# MYSQL · StatefulSet + Headless Service
# -----------------------------------------------------------------------------
# MySQL necesita IDENTIDAD ESTABLE y datos persistentes → StatefulSet.
#   · mysql-0 es siempre el mismo Pod (sin sufijo aleatorio).
#   · volumeClaimTemplates crea un PVC por réplica (data-mysql-0).
#   · El Service headless "mysql-headless" da DNS estable por Pod:
#         mysql-0.mysql-headless.default.svc.cluster.local
#
# Almacenamiento:
#   · Este archivo usa APROVISIONAMIENTO DINÁMICO: el PVC pide 5Gi y la
#     StorageClass por defecto del clúster lo crea.
#       - Docker Desktop → hostpath (default)
#       - minikube       → standard
#   · El PV de abajo está COMENTADO para el modo dinámico. Para usar
#     almacenamiento estático/manual: descoméntalo, descomenta
#     "storageClassName: manual" en volumeClaimTemplates y crea antes la
#     carpeta /mnt/mysql-data en el nodo.
#   kubectl apply -f mysql-sts.yaml
#   kubectl get sts,pods,pvc,svc
# =============================================================================
#
# --- PV opcional (aprovisionamiento estático) ---
# apiVersion: v1
# kind: PersistentVolume
# metadata:
#   name: mysql-data-pv
#   labels:
#     app.kubernetes.io/name: mysql
#     app.kubernetes.io/component: database
# spec:
#   capacity:
#     storage: 5Gi
#   accessModes:
#     - ReadWriteOnce                    # un solo nodo a la vez
#   persistentVolumeReclaimPolicy: Retain    # conserva los datos al liberar
#   storageClassName: manual
#   hostPath:
#     path: /mnt/mysql-data              # carpeta del nodo (debe existir)
#     type: DirectoryOrCreate
# ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: curso-kubernetes
spec:
  serviceName: mysql-headless  # debe coincidir con el Service headless de abajo
  replicas: 1                  # 1 instancia; escalar MySQL requiere replicación
  selector:
    matchLabels:               # debe coincidir con template.metadata.labels
      app.kubernetes.io/name: mysql
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: curso-kubernetes
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:                    # credenciales inyectadas desde el Secret
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: root-password
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: database-name
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: username
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: password
        ports:
        - containerPort: 3306   # puerto de MySQL (informativo)
          name: mysql
        resources:
          requests:             # reserva mínima por Pod
            memory: "256Mi"
            cpu: "250m"
          limits:               # techo por Pod
            memory: "512Mi"     # si lo pasa: OOMKilled
            cpu: "500m"         # si lo pasa: throttling
        volumeMounts:           # DÓNDE se ven los datos dentro del contenedor
        - name: data
          mountPath: /var/lib/mysql
  volumeClaimTemplates:         # un PVC por Pod: data-mysql-0, data-mysql-1...
  - metadata:
      name: data
      labels:                   # labels del PVC generado
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: curso-kubernetes
    spec:
      # storageClassName: manual    # descomentar junto con el PV de arriba
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
---
# --- Headless Service: DNS estable para el StatefulSet ---
apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: curso-kubernetes
spec:
  clusterIP: None              # headless: sin IP virtual ni balanceo
  selector:                    # selecciona los Pods del StatefulSet
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
  ports:
  - port: 3306                 # puerto del Service
    name: mysql
    targetPort: mysql          # referencia el puerto por nombre
