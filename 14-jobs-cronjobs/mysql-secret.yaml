# =============================================================================
# SECRET · Credenciales de MySQL
# -----------------------------------------------------------------------------
# Los valores van en base64 (NO cifrado). El StatefulSet y los Jobs los
# inyectan como variables de entorno con secretKeyRef.
#   Generar base64: echo -n "rootpassword" | base64
#   Decodificar:    echo "cm9vdHBhc3N3b3Jk" | base64 -d
#   kubectl apply -f mysql-secret.yaml
#   kubectl get secret mysql-credentials -o yaml
#
# El nombre del archivo (mysql-secret.yaml) describe el KIND; el nombre del
# objeto (mysql-credentials) describe el CONTENIDO. Son cosas distintas.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials    # nombre que referencian el StatefulSet y los Jobs
  labels:                    # labels recomendados de Kubernetes
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: curso-kubernetes
type: Opaque                # tipo genérico: pares clave-valor arbitrarios
data:                       # valores YA codificados en base64 (no en claro)
  root-password: cm9vdHBhc3N3b3Jk    # "rootpassword" (password de root)
  database-name: bXlkYg==            # "mydb" (base de datos inicial)
  username: bXl1c2Vy                 # "myuser" (usuario de la app)
  password: bXlwYXNzd29yZA==         # "mypassword" (password de myuser)
