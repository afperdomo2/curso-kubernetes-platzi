# =============================================================================
# SECRET · Datos sensibles (base64, NO cifrado)
# -----------------------------------------------------------------------------
# Igual que un ConfigMap, pero pensado para credenciales. Los valores van en
# base64; cualquiera con acceso al clúster puede decodificarlos.
#   Generar base64: echo -n "myclientid" | base64
#   Decodificar:    echo "bXljbGllbnRpZA==" | base64 -d
#   kubectl apply -f auth-secret.yml
#   kubectl get secret auth-secret -o yaml
# =============================================================================
apiVersion: v1                # API core (v1)
kind: Secret                  # Datos sensibles
metadata:
  name: auth-secret           # Nombre con el que se inyecta (secretKeyRef)
type: Opaque                  # Tipo genérico: pares clave-valor arbitrarios
data:                         # Valores YA codificados en base64 (no en claro)
  client_id: "bXljbGllbnRpZA=="      # base64 de "myclientid"
  client_secret: "c2VjcmV0"          # base64 de "secret"
